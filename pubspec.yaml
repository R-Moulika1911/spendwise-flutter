name: spendwise
description: SpendWise — daily expense tracker with categories, charts, and offline storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0
  share_plus: ^11.0.0
  csv: ^6.0.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/wise_owl_logo.png
  adaptive_icon_background: "#F2EEE6"
  adaptive_icon_foreground: assets/images/wise_owl_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/wise_owl_logo.png
